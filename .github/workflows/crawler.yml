name: Get Hot News

on:
  schedule:
    # 试用版：每 7 天需运行 "Check In" 续期，否则本工作流会被自动禁用。
    # 调度：UTC 每 3 小时整点运行（GitHub Actions cron 使用 UTC，可能有数分钟延迟）
    # cron: "0 */3 * * *"
    # 对应 Asia/Shanghai (UTC+8)：02:00、05:00、08:00、11:00、14:00、17:00、20:00、23:00
    #
    - cron: "0 */3 * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 同任务内启动 RSSHub，供 config 里 http://localhost:1200/... 的 RSS 源使用
    services:
      rsshub:
        image: diygod/rsshub
        ports:
          - 1200:1200
        env:
          CACHE_TYPE: memory
          NODE_ENV: production
          # RSSHub Twitter/X auth (auth_token cookie). Do not log this value.
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Check Expiration
        run: |
          echo "7-day Check In auto-disable is turned off."
          echo "Scheduled Get Hot News runs will not stop on their own."

      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      # - name: Random Delay (Traffic Control)
      #   if: success()
      #   run: |
      #     echo "🎲 Traffic Control: Generating random delay..."
      #     DELAY=$(( ( RANDOM % 300 )  + 1 ))
      #     echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
      #     sleep ${DELAY}s
      #     echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Wait for RSSHub
        if: success()
        run: |
          echo "Waiting for RSSHub at http://localhost:1200/ ..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1200/ >/dev/null; then
              echo "RSSHub is up (attempt $i)"
              exit 0
            fi
            echo "RSSHub not ready yet ($i/60), retrying in 5s..."
            sleep 5
          done
          echo "RSSHub failed to become healthy within 5 minutes"
          exit 1

      - name: Restore xAI refresh token cache
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: .xai/rt.enc
          key: xai-rt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: xai-rt-

      - name: Get xAI access token (SuperGrok OAuth)
        if: success()
        env:
          SECRET_RT: ${{ secrets.XAI_REFRESH_TOKEN }}
          PASS: ${{ secrets.XAI_CACHE_PASSPHRASE }}
        run: |
          set +e
          mkdir -p .xai
          try_refresh() {
            curl -sS -m 30 -X POST https://auth.x.ai/oauth2/token \
              --data-urlencode grant_type=refresh_token \
              --data-urlencode client_id=b1a00492-073a-47ea-816f-4c329264a828 \
              --data-urlencode "refresh_token=$1" -o .xai/resp.json -w '%{http_code}' 2>/dev/null
          }
          AT=""; SRC=""
          if [ -f .xai/rt.enc ] && [ -n "$PASS" ]; then
            CRT=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass env:PASS -in .xai/rt.enc 2>/dev/null)
            if [ -n "$CRT" ]; then
              echo "::add-mask::$CRT"
              CODE=$(try_refresh "$CRT")
              AT=$(jq -r '.access_token // empty' .xai/resp.json 2>/dev/null)
              if [ "$CODE" = "200" ] && [ -n "$AT" ]; then SRC=cache; else AT=""; echo "Cached refresh token failed (HTTP $CODE), falling back to secret"; fi
            fi
          else
            echo "No cached refresh token found"
          fi
          if [ -z "$AT" ] && [ -n "$SECRET_RT" ]; then
            CODE=$(try_refresh "$SECRET_RT")
            AT=$(jq -r '.access_token // empty' .xai/resp.json 2>/dev/null)
            if [ "$CODE" = "200" ] && [ -n "$AT" ]; then SRC=secret; else AT=""; echo "Secret refresh token failed (HTTP $CODE)"; fi
          fi
          if [ -z "$AT" ]; then
            echo "::warning::xAI token refresh failed; running WITHOUT AI digest (raw email still sent)"
            rm -f .xai/resp.json; exit 0
          fi
          echo "::add-mask::$AT"
          NRT=$(jq -r '.refresh_token // empty' .xai/resp.json)
          rm -f .xai/resp.json
          if [ -n "$NRT" ]; then
            echo "::add-mask::$NRT"
            printf '%s' "$NRT" | openssl enc -aes-256-cbc -pbkdf2 -a -A -salt -pass env:PASS -out .xai/rt.enc
            echo "Saved rotated refresh token (encrypted)"
          fi
          echo "xAI access token obtained via $SRC refresh token"
          {
            echo "AI_API_KEY=$AT"
            echo "AI_API_BASE=https://api.x.ai/v1"
            echo "AI_MODEL=openai/grok-4.20-0309-non-reasoning"
          } >> "$GITHUB_ENV"

      - name: Save xAI refresh token cache
        if: success() && hashFiles('.xai/rt.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .xai/rt.enc
          key: xai-rt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore sent history cache
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: .sent-history/history.enc
          key: sent-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sent-history-

      - name: Run crawler
        if: success()
        env:
          XAI_CACHE_PASSPHRASE: ${{ secrets.XAI_CACHE_PASSPHRASE }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Save sent history cache
        if: success() && hashFiles('.sent-history/history.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .sent-history/history.enc
          key: sent-history-${{ github.run_id }}-${{ github.run_attempt }}

      # --------------------------------------------------------------------------------
      # ☁️ CLOUDFLARE PAGES DEPLOY / 部署到 Cloudflare Pages（可选）
      # --------------------------------------------------------------------------------
      # 将爬虫生成的 index.html 自动部署到 Cloudflare Pages，国内访问比 GitHub Pages 更快。
      # 仅当下面三个 Secrets 均已配置时才会执行，缺任意一个则自动跳过，不影响其它流程：
      #   - CLOUDFLARE_API_TOKEN     权限：Account → Cloudflare Pages → Edit
      #   - CLOUDFLARE_ACCOUNT_ID    Cloudflare 账户 ID
      #   - CLOUDFLARE_PROJECT_NAME  Cloudflare Pages 项目名（需提前在 Dashboard 创建）
      # 配置教程详见 README「自动部署到 Cloudflare Pages」章节。
      # --------------------------------------------------------------------------------
      - name: Check Cloudflare config
        if: success()
        id: cf_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 Cloudflare 配置，准备部署到 Cloudflare Pages"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未配置 Cloudflare Secrets，跳过 Cloudflare Pages 部署"
          fi

      - name: Prepare Cloudflare Pages assets
        if: success() && steps.cf_check.outputs.enabled == 'true'
        run: |
          if [ ! -f index.html ]; then
            echo "❌ 未找到 index.html，请确认爬虫已生成网页报告"
            exit 1
          fi
          rm -rf cloudflare_dist
          mkdir -p cloudflare_dist
          cp index.html cloudflare_dist/index.html

      - name: Deploy to Cloudflare Pages
        if: success() && steps.cf_check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
